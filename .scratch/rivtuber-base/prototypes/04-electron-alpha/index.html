<!doctype html>
<!--
PROTOTYPE, THROWAWAY. Electron window with a transparent background and the rig on top.
Drop catperson.riv anywhere on the window.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE: Electron alpha</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #rive { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #status { position: fixed; left: 8px; bottom: 8px; font: 12px/1.3 system-ui; color: #fff;
            background: #0008; padding: 4px 6px; border-radius: 4px; }
</style>
</head>
<body>
<canvas id="rive"></canvas>
<div id="status">Drop catperson.riv here.</div>
<script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2@2.45.0/rive.js"></script>
<script>
const status = document.getElementById('status');
const canvas = document.getElementById('rive');

// Size the bitmap to the displayed box, or the rig fits into the default 300x150 canvas.
function sizeCanvas() {
  canvas.width = canvas.clientWidth * window.devicePixelRatio;
  canvas.height = canvas.clientHeight * window.devicePixelRatio;
}

async function loadRig(file) {
  const riveFile = new rive.RiveFile({ buffer: await file.arrayBuffer() });
  await riveFile.init();
  sizeCanvas();
  await new Promise((resolve, reject) => {
    const r = new rive.Rive({
      riveFile,
      canvas,
      autoplay: true,
      onLoad: () => {
        const vmi = r.defaultViewModel()?.defaultInstance();
        if (vmi) r.bindViewModelInstance(vmi);
        status.textContent = `${file.name}: ${vmi ? vmi.properties.length : 0} properties.`;
        resolve();
      },
      onLoadError: (event) => reject(new Error(typeof event.data === 'string' ? event.data : 'load error')),
    });
  });
}

window.addEventListener('dragover', (event) => event.preventDefault());
window.addEventListener('drop', (event) => {
  event.preventDefault();
  const file = event.dataTransfer.files[0];
  if (!file) return;
  status.textContent = `Loading ${file.name}...`;
  loadRig(file).catch((error) => {
    status.textContent = `Could not load ${file.name}: ${error.message}`;
  });
});
</script>
</body>
</html>
